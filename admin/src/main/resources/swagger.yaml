openapi: 3.0.0
info:
  title: Admin Service API
  description: API specification for the Admin microservice.
  version: 1.0.0
paths:
  /hi:
    get:
      summary:  Hi from Admin Service
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
  /recruiter:
    get:
      tags:
        - Recruiter
      summary: Get all recruiters
      operationId: getAll
      responses:
        '200':
          description: List of recruiters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecruiterDTO'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error

    post:
      tags:
        - Recruiter
      summary: Add a new recruiter
      operationId: add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterDTO'
      responses:
        '201':
          description: Recruiter created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterDTO'
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error

  /recruiter/{id}:
    get:
      tags:
        - Recruiter
      summary: Get recruiter by ID
      operationId: getById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recruiter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterDTO'
        '400':
          description: Bad Request
        '404':
          description: Recruiter not found
        '500':
          description: Internal Server Error

    put:
      tags:
        - Recruiter
      summary: Update recruiter by ID
      operationId: updateById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterDTO'
      responses:
        '200':
          description: Recruiter updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterDTO'
        '400':
          description: Bad Request
        '404':
          description: Recruiter not found
        '500':
          description: Internal Server Error

    delete:
      tags:
        - Recruiter
      summary: Delete recruiter by ID
      operationId: deleteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recruiter deleted successfully
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
        '404':
          description: Recruiter not found
        '500':
          description: Internal Server Error

components:
  schemas:
    RecruiterDTO:
      type: object
      required:
        - name
        - designation
        - email
        - phoneNumber
        - location
        - company
      properties:
        id:
          type: string
          example: "101"

        name:
          type: string
          example: "Kavishree . S"
          description: "Only alphabets, spaces, and dots allowed"
          pattern: '^[A-Za-z. ]+$'
          minLength: 2
          maxLength: 50
          x-pattern-message: "Name must contain only alphabets, spaces, and dots (2–50 characters)"

        designation:
          type: string
          example: "Senior Technical Recruiter"
          description: "Should contain alphabets and spaces only"
          pattern: '^[A-Za-z ]+$'
          minLength: 2
          maxLength: 50
          x-pattern-message: "Designation must contain only alphabets and spaces, 2-50 characters"

        email:
          type: string
          format: email
          example: "primary@company.com"
          description: "Valid email format"
          pattern: '^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$'
          x-pattern-message: "Email must be in a valid format, e.g., primary@company.com"

        secondaryEmail:
          type: string
          format: email
          example: "secondary@company.com"
          pattern: '^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$'
          x-pattern-message: "Secondary email must be in a valid format"

        phoneNumber:
          type: string
          example: "+91 9876543210"
          description: "Valid Indian mobile number (10 digits, +91 optional)"
          pattern: '^(\+91\s?)?[6-9][0-9]{9}$'
          x-pattern-message: "Phone number must be a valid 10-digit Indian number, with optional +91"

        mobileNumber:
          type: string
          example: "9876543210"
          description: "Valid Indian mobile number (10 digits, +91 optional)"
          pattern: '^(\+91\s?)?[6-9][0-9]{9}$'
          x-pattern-message: "Mobile number must be a valid 10-digit Indian number, with optional +91"


        location:
          type: string
          example: "Chennai, Tamil Nadu"
          description: "Letters, commas and spaces only"
          pattern: '^[A-Za-z, ]+$'
          minLength: 2
          maxLength: 100
          x-pattern-message: "Location must contain only letters, commas, and spaces, 2-100 characters"

        company:
          type: string
          example: "Mentor Bridge"
          description: "Letters, numbers, and spaces allowed"
          pattern: '^[A-Za-z0-9 ]+$'
          minLength: 2
          maxLength: 100
          x-pattern-message: "Company must contain letters, numbers, and spaces, 2-100 characters"

        description:
          type: string
          example: "Recruiter with 10 years of experience in IT hiring."
          maxLength: 500
          x-pattern-message: "Description cannot exceed 500 characters"

        createdAt:
          type: string
        createdBy:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string

